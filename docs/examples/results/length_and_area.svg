<text x="120" y="101" font-size="13" text-anchor="end" fill="#222222">T001 L044</text>
<rect x="130" y="82" width="470.00" height="28" fill="#f0a868"><title>T001 L044: 17.94 mm</title></rect>
<text x="608.00" y="101" font-size="13" fill="#222222">17.94 mm</text>
<text x="120" y="141" font-size="13" text-anchor="end" fill="#222222">T012 L047</text>
<rect x="130" y="122" width="71.52" height="28" fill="#f0a868"><title>T012 L047: 2.73 mm</title></rect>
