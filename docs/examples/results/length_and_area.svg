<text x="120" y="277" font-size="13" text-anchor="end" fill="#222222">T001 L044</text>
<rect x="130" y="258" width="470.00" height="28" fill="#5fd6a0"><title>T001 L044: 17.04 mm²</title></rect>
<text x="608.00" y="277" font-size="13" fill="#222222">17.04 mm²</text>
<text x="120" y="317" font-size="13" text-anchor="end" fill="#222222">T012 L047</text>
