name: CI

on:
  push:
    branches: [main, v3, "refactor/**"]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The app runs on Windows, Linux and macOS (O21); macOS runs on Apple silicon, CPU only.
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash  # every step stops at its first failing command, on all three OSes
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system libs for Qt/OpenCV (headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install PyTorch (CPU)
        # Same release as the recommended GPU build (README "Installation"), CPU wheels:
        # CI only needs the inference modules to import and run on CPU.
        run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check .

      - name: Test suite
        # Remove after the first green macOS run (WX-T6 step 8): the one OS not run locally.
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
        run: pytest -q -rfE

  package:
    name: wheel builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build the wheel
        run: python -m pip wheel --no-deps -w dist .

      - name: Install it in a clean venv and check what the app loads at run time
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --no-deps dist/*.whl
          cd /tmp  # import from site-packages, not from the checkout
          /tmp/wheel-venv/bin/python - <<'EOF'
          import importlib.metadata as md
          import os

          import app
          from resources.resource_utils import get_resource_path

          assert md.version("root-mask-and-skeletons") == app.__version__
          for rel in (
              "resources/themes/dark_theme.qss",
              "resources/icons/sprouts/sprouts_logo.svg",
              "resources/app_icon.ico",
              "app/assets/style.css",
          ):
              assert os.path.isfile(get_resource_path(rel)), rel
          scripts = {e.name: e.value for e in md.entry_points(group="console_scripts")}
          assert scripts.get("sprouts") == "main:main", scripts
          print("wheel OK:", app.__version__)
          EOF

  citation:
    name: CITATION.cff is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CITATION.cff (Citation File Format 1.2.0)
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
