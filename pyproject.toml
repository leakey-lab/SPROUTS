[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "root-mask-and-skeletons"
# Single source of the version: app/__init__.py (__version__), read statically by setuptools.
dynamic = ["version"]
description = "SPROUTS: plant-root phenotyping from minirhizotron images (root masks, skeletons, correction editors, calibrated root length and area, dashboards)."
readme = "README.md"
requires-python = ">=3.10"
# TODO(owner): add co-authors/maintainers and ORCIDs (kept in sync with CITATION.cff).
authors = [{ name = "Kinjalk Parth" }]
# TODO(owner): license is pending (README "License", FR-01). Once chosen, add
# license = "<SPDX id>" and license-files = ["LICENSE"] (PEP 639, setuptools>=77).
keywords = [
    "plant phenotyping",
    "minirhizotron",
    "root segmentation",
    "skeletonization",
    "root length",
    "root area",
    "deep learning",
    "ground truth annotation",
]
classifiers = [
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Compatible ranges; the exact tested pins live in requirements.txt (a test keeps them in
# sync). torch/torchvision are deliberately absent: install the build matching your CUDA
# (or CPU) first, see README "Installation" -- pip must never swap in a CPU wheel.
dependencies = [
    "PyQt6~=6.11",
    "PyQt6-WebEngine~=6.11",
    "numpy~=2.2",
    "scipy~=1.15",
    "scikit-image~=0.25",
    "opencv-python~=4.13",
    "pillow~=12.2",
    "pandas~=2.3",
    "dash~=4.1",
    "dash-bootstrap-components~=2.0",
    "plotly~=6.7",
    "requests~=2.34",
    "pywin32>=308; sys_platform == \"win32\"",
]

[project.urls]
Homepage = "https://github.com/leakey-lab/Root-Mask-and-Skeletons"
Repository = "https://github.com/leakey-lab/Root-Mask-and-Skeletons"
Issues = "https://github.com/leakey-lab/Root-Mask-and-Skeletons/issues"
Changelog = "https://github.com/leakey-lab/Root-Mask-and-Skeletons/blob/main/CHANGELOG.md"

[project.scripts]
sprouts = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*", "resources*"]
exclude = ["*__pycache__*", "resources.App Image"]

# Whole asset trees ("**" is recursive in setuptools): Dash serves every file in app/assets
# (vendored CSS, fonts and their licence texts), Qt loads the theme and icons.
[tool.setuptools.package-data]
app = ["assets/**/*"]
resources = ["themes/**/*", "icons/**/*", "app_icon.ico", "app_icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

# Ruff is the single lint + import-sort ("I") + format tool (pre-commit and CI run it).
# Do not add [tool.black] / [tool.isort] back: the formatters disagree on some lines.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
